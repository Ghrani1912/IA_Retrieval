[project]
name = "historical-rag-platform"
version = "0.1.0"
description = "AI-powered historical information retrieval and reasoning platform on Internet Archive"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "arq==0.25.0",
    "redis==5.0.4",
    "opensearch-py==2.5.0",
    "qdrant-client==1.18.0",
    "sentence-transformers==3.0.1",
    "aioboto3==12.4.0",
    "httpx==0.27.0",
    "pydantic>=2.7.1",
    "pydantic-settings==2.3.0",
    "python-dotenv==1.0.1",
    "readability-lxml==0.8.1",
    "lxml==5.2.2",
    "tiktoken==0.7.0",
    "openai==1.30.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-httpx==0.30.0",
    "hypothesis==6.103.1",
    "moto[s3]==5.0.10",
    "coverage==7.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
